# mapmise ask rules — how words in a request become DATA NEEDS.
#
# A need is generic: a theme, a temporal mode and a priority, with the reason it is proposed.
# Rules compose: every rule whose keywords match contributes its needs; the union is the request.
# There is no "flood workflow" or "drought workflow" here — only themes. An LLM could later
# emit the same needs; the resolver downstream would not change.
#
#   keywords   regexes, case-insensitive, matched against the ask text
#   examples   natural phrasings of this kind of ask; the built-in AI matches asks that use none of the
#              keywords by meaning against these. Add phrasings people actually use — any language the
#              model understands (the alpha model is English).
#   needs[].theme      one of THEMES
#   needs[].temporal   static | series | pair   (pair = before/after an event date)
#   needs[].priority   required | recommended | optional
#   needs[].prefer     optional hints for ranking sources: cloud_independent, max_resolution_m
#   needs[].why        shown to the user

- id: flood
  keywords: ["\\bflood", "inundat", "\\bcyclone", "storm surge", "water ?logg"]
  examples:
    - "the river overflowed and villages went under water"
    - "heavy rain submerged the town last week"
    - "map the areas that were inundated after the storm"
    - "cyclone landfall caused water logging in the fields"
    - "which parts were under water after the dam released water"
  event_type: flood
  needs:
    - {theme: sar,        temporal: pair,   priority: required,    prefer: {cloud_independent: true},
       why: "floods happen under cloud; radar backscatter before/after the event shows new open water"}
    - {theme: optical,    temporal: pair,   priority: recommended, why: "optical before/after for validation and mapping where a clear scene exists"}
    - {theme: water,      temporal: static, priority: required,    why: "where water normally is, so new water can be separated from permanent water"}
    - {theme: elevation,  temporal: static, priority: required,    why: "low-lying terrain and flow direction; HAND-style exposure needs a DEM"}
    - {theme: population, temporal: static, priority: recommended, why: "who is exposed"}
    - {theme: buildings,  temporal: static, priority: optional,    why: "what is exposed"}
    - {theme: transport,  temporal: static, priority: optional,    why: "access and disruption"}
    - {theme: hydrography, temporal: static, priority: optional,   why: "rivers and canals that carry the flood"}
    - {theme: facilities, temporal: static, priority: optional,    why: "hospitals and schools that may be cut off or used as shelters"}

- id: drought
  keywords: ["\\bdrought", "crop (stress|condition|failure)", "monsoon (failure|deficit)", "rain(fall)? deficit", "dry spell"]
  examples:
    - "the monsoon failed and crops are drying up"
    - "farmers lost their harvest because it did not rain"
    - "assess water stress on agriculture this season"
    - "below normal rainfall hit the kharif crop"
    - "how dry is the district compared to normal years"
  needs:
    - {theme: vegetation,    temporal: series, priority: required,    why: "vegetation condition over time (NDVI) is the crop-stress signal"}
    - {theme: precipitation, temporal: series, priority: required,    why: "drought is a rainfall deficit first; vegetation lags rain by weeks"}
    - {theme: soil_moisture, temporal: series, priority: recommended, why: "the physical link between rainfall deficit and crop stress"}
    - {theme: sar,           temporal: series, priority: optional,    prefer: {cloud_independent: true},
       why: "cloud-independent fallback for months where optical is infeasible"}
    - {theme: landcover,     temporal: static, priority: recommended, why: "to restrict the analysis to cropland"}

- id: vegetation
  keywords: ["\\bndvi", "vegetation (index|time ?series|monitoring|change)", "crop (monitoring|phenology|growth|mapping|calendar)", "greenness", "forest (cover|loss|change)"]
  examples:
    - "how green are the fields through the season"
    - "track crop growth over the months"
    - "monitor the health of plantations"
    - "vegetation condition over the year"
    - "how did the crop cover change between seasons"
  needs:
    - {theme: vegetation, temporal: series, priority: required, why: "red/NIR time series for vegetation indices"}
    - {theme: landcover,  temporal: static, priority: optional, why: "context mask (cropland, tree cover)"}

- id: urban
  keywords: ["\\burban", "built[- ]?up", "city (growth|expansion|sprawl)", "settlement (growth|expansion)", "urbani[sz]ation", "land use change"]
  examples:
    - "how much has the city grown"
    - "track new construction on the outskirts"
    - "land converted from farms to housing"
    - "growth of built-up area around the town"
    - "how fast is the town spreading"
  needs:
    - {theme: builtup,    temporal: series, priority: required,    why: "yearly built-up / land use classes show expansion"}
    - {theme: landcover,  temporal: series, priority: optional,    why: "long-record land cover when the period reaches before 2017"}
    - {theme: optical,    temporal: series, priority: recommended, why: "imagery for visual interpretation and change"}
    - {theme: population, temporal: static, priority: recommended, why: "people per cell — growth in context"}
    - {theme: buildings,  temporal: static, priority: optional,    why: "current footprints"}
    - {theme: transport,  temporal: static, priority: optional,    why: "network driving expansion"}

- id: water_bodies
  keywords: ["\\b(reservoir|lake|wetland|tank|pond)s?\\b", "surface water", "water (extent|body|bodies|spread|level)"]
  examples:
    - "how full is the lake this year"
    - "is the tank drying up"
    - "changes in reservoir water spread"
    - "monitor wetland extent over time"
    - "how much water is in the dam"
  needs:
    - {theme: water,   temporal: series, priority: required,    why: "water extent over time from optical (NDWI/MNDWI) or radar"}
    - {theme: water,   temporal: static, priority: recommended, why: "long-term occurrence baseline"}
    - {theme: optical, temporal: series, priority: recommended, why: "green/SWIR bands for water indices"}

- id: terrain
  keywords: ["\\b(slope|terrain|elevation|watershed|catchment|hillshade|landslides?|runoff)\\b", "\\bdem\\b"]
  examples:
    - "how steep is the land"
    - "delineate the catchment of the stream"
    - "elevation profile of the hills"
    - "which slopes are prone to landslides"
    - "terrain analysis for site selection"
  needs:
    - {theme: elevation, temporal: static, priority: required, why: "digital elevation model"}

- id: access
  keywords: ["\\broad", "accessib", "connectivity", "\\broute", "transport"]
  examples:
    - "how far are villages from the nearest road"
    - "road connectivity of remote settlements"
    - "travel time to the town"
    - "which areas are cut off from transport"
    - "network analysis of the district roads"
  needs:
    - {theme: transport, temporal: static, priority: required, why: "road network"}
    - {theme: population, temporal: static, priority: recommended, why: "who is served or cut off"}

- id: boundaries
  keywords: ["district", "admin(istrative)? (boundar|unit)", "taluk", "block", "village boundar"]
  examples:
    - "summarise by taluk"
    - "statistics for each administrative unit"
    - "district and block boundaries"
    - "aggregate results per village"
    - "admin units of the state"
  needs:
    - {theme: boundaries, temporal: static, priority: optional, why: "administrative units for aggregation"}

- id: rainfall
  keywords: ["\\brain(fall|s|y|ed)?\\b", "precipitation", "\\bmonsoon"]
  examples:
    - "how much did it rain this season"
    - "monthly precipitation totals"
    - "rainfall anomaly compared with normal"
    - "was the monsoon above or below average"
    - "rain distribution over the months"
  needs:
    - {theme: precipitation, temporal: series, priority: required, why: "rainfall totals over the period"}

- id: forest
  keywords: ["\\bforest", "deforest", "tree cover", "canopy", "logging", "mangrove"]
  examples:
    - "how much forest has been cleared"
    - "tree cover loss since the last decade"
    - "deforestation hotspots in the hills"
    - "is the jungle shrinking"
    - "illegal logging in the reserve"
  needs:
    - {theme: forest,    temporal: static, priority: required,    why: "tree cover baseline and year of loss per pixel"}
    - {theme: landcover, temporal: series, priority: recommended, why: "land cover through time to see what replaced the forest"}
    - {theme: optical,   temporal: series, priority: optional,    why: "imagery to inspect recent change"}

- id: fire
  keywords: ["\\bfires?\\b", "wildfire", "\\bburn", "stubble"]
  examples:
    - "where did the fires burn this year"
    - "burnt area after the forest fire"
    - "crop residue burning in the fields"
    - "extent of the wildfire"
    - "which areas were scorched"
  needs:
    - {theme: fire,       temporal: series, priority: required,    why: "mapped burned area by month"}
    - {theme: vegetation, temporal: series, priority: recommended, why: "vegetation before and after burning"}
    - {theme: landcover,  temporal: static, priority: recommended, why: "what burned — cropland, forest, grassland"}

- id: heat
  keywords: ["\\bheat", "temperature", "\\blst\\b", "hot ?spot", "thermal"]
  examples:
    - "which neighbourhoods are the hottest"
    - "urban heat island in the city"
    - "surface temperature during the heatwave"
    - "how hot does the ground get in summer"
    - "thermal hotspots in the town"
  needs:
    - {theme: temperature, temporal: series, priority: required,    why: "land surface temperature day and night"}
    - {theme: builtup,     temporal: static, priority: recommended, why: "built-up land drives urban heat"}
    - {theme: vegetation,  temporal: series, priority: optional,    why: "vegetation cools; NDVI explains much of LST"}

- id: soil
  keywords: ["\\bsoils?\\b", "erosion", "fertility", "organic carbon", "\\bph\\b"]
  examples:
    - "what is the soil like here"
    - "soil carbon and texture of the fields"
    - "is the land fertile"
    - "soil erosion risk on farms"
    - "clay and sand content of the soil"
  needs:
    - {theme: soil,      temporal: static, priority: required,    why: "soil properties — carbon, texture, pH"}
    - {theme: elevation, temporal: static, priority: recommended, why: "slope drives erosion and drainage"}
    - {theme: landcover, temporal: static, priority: recommended, why: "land use on the soil"}

- id: services
  keywords: ["hospital", "school", "clinic", "health (care|facilit|access)", "facilit", "service (access|coverage)"]
  examples:
    - "how far do people travel to reach a hospital"
    - "coverage of schools in rural areas"
    - "which villages lack a health centre nearby"
    - "access to clinics for pregnant women"
    - "nearest primary health centre for each village"
  needs:
    - {theme: facilities, temporal: static, priority: required,    why: "where the services are"}
    - {theme: transport,  temporal: static, priority: required,    why: "how people reach them"}
    - {theme: population, temporal: static, priority: recommended, why: "who they serve"}
    - {theme: boundaries, temporal: static, priority: optional,    why: "administrative units for summaries"}
