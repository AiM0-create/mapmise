<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024"><defs>
  <clipPath id="sq"><path d="M512 0c230 0 330 0 421 91s91 191 91 421-0 330-91 421-191 91-421 91-330 0-421-91S0 742 0 512 0 182 91 91 282 0 512 0z"/></clipPath>
  <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#0a4fd1"/></linearGradient>
  <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#e3e6ec"/></linearGradient>
  <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2a37"/><stop offset="1" stop-color="#0b1119"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe8ff"/></linearGradient>
  <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4a0"/><stop offset="1" stop-color="#34b36b"/></linearGradient>
  <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ccfff"/><stop offset="1" stop-color="#4a9bf0"/></linearGradient>
  <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#e0342a"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee0c8"/><stop offset="1" stop-color="#1aa98f"/></linearGradient>

  <!-- A: Layers — three stacked map sheets -->
  <symbol id="A" viewBox="0 0 1024 1024"><g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bgA)"/>
    <g transform="translate(512 610) scale(1.22)">
      <path d="M-300 60 L0 -90 L300 60 L0 210 Z" fill="#0a3fa8" opacity=".35" transform="translate(0 40)"/>
      <path d="M-300 60 L0 -90 L300 60 L0 210 Z" fill="url(#l3)"/>
      <path d="M-300 -40 L0 -190 L300 -40 L0 110 Z" fill="#0a3fa8" opacity=".25" transform="translate(0 30)"/>
      <path d="M-300 -40 L0 -190 L300 -40 L0 110 Z" fill="url(#l2)"/>
      <path d="M-300 -140 L0 -290 L300 -140 L0 10 Z" fill="#0a3fa8" opacity=".25" transform="translate(0 30)"/>
      <path d="M-300 -140 L0 -290 L300 -140 L0 10 Z" fill="url(#l1)"/>
      <path d="M-210 -150 C-120 -200 -60 -110 20 -160 S160 -190 220 -130" fill="none" stroke="#4a9bf0" stroke-width="16" stroke-linecap="round"/>
      <path d="M-120 -95 L60 -185 M-40 -60 L140 -150" stroke="#b9cbe6" stroke-width="8" stroke-linecap="round"/>
    </g>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
  </g></symbol>

  <!-- B: Pin on folded map, refined -->
  <symbol id="B" viewBox="0 0 1024 1024"><g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bgB)"/>
    <g transform="translate(0 40)">
      <path d="M190 330 L400 270 L620 330 L834 270 L834 730 L620 790 L400 730 L190 790 Z" fill="#000" opacity=".08" transform="translate(0 24)"/>
      <path d="M190 330 L400 270 L400 730 L190 790 Z" fill="#dff0e3"/>
      <path d="M400 270 L620 330 L620 790 L400 730 Z" fill="#c6e4cf"/>
      <path d="M620 330 L834 270 L834 730 L620 790 Z" fill="#dff0e3"/>
      <path d="M190 640 C280 600 330 680 410 630 S560 560 640 620 S770 600 834 560" fill="none" stroke="#5aa7f2" stroke-width="22" stroke-linecap="round"/>
      <path d="M240 470 L380 430 M450 400 L580 440 M660 420 L790 380" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".9"/>
    </g>
    <g transform="translate(560 170)">
      <ellipse cx="60" cy="410" rx="70" ry="18" fill="#000" opacity=".18"/>
      <path d="M60 0 C160 0 220 70 220 160 C220 270 60 400 60 400 C60 400 -100 270 -100 160 C-100 70 -40 0 60 0Z" fill="url(#pin)"/>
      <circle cx="60" cy="160" r="62" fill="#fff"/>
      <path d="M-40 90 C-10 40 40 20 90 22" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none" opacity=".35"/>
    </g>
  </g></symbol>

  <!-- C: Tile grid with contour, clipped to area -->
  <symbol id="C" viewBox="0 0 1024 1024"><g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bgC)"/>
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="3">
      <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
    </g>
    <path d="M300 250 L610 190 L800 330 L840 560 L700 790 L420 830 L230 660 L200 420 Z" fill="url(#teal)"/>
    <g fill="none" stroke="#0b1119" stroke-opacity=".22" stroke-width="10">
      <path d="M300 420 C400 360 520 400 600 350 S760 380 800 440"/>
      <path d="M270 560 C390 500 520 560 640 500 S780 540 830 580"/>
      <path d="M300 690 C420 640 540 700 660 650 S760 680 790 700"/>
    </g>
    <path d="M300 250 L610 190 L800 330 L840 560 L700 790 L420 830 L230 660 L200 420 Z" fill="none" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
    <circle cx="610" cy="190" r="26" fill="#fff"/><circle cx="200" cy="420" r="26" fill="#fff"/><circle cx="700" cy="790" r="26" fill="#fff"/>
    <rect width="1024" height="1024" fill="url(#gloss)" opacity=".6"/>
  </g></symbol>
</defs><use href="#A" xlink:href="#A" width="1024" height="1024"/></svg>