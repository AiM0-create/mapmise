[project]
name = "mapmise"
version = "0.1.0a1"
description = "Say what you want to analyse and where; get the right open geospatial data, clipped, organised and documented, locally."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhishek Rawat" }]
requires-python = ">=3.12"
keywords = ["gis", "remote-sensing", "earth-observation", "stac", "sentinel", "landsat", "openstreetmap", "reproducibility", "qgis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pystac-client>=0.9",
    "pystac>=1.12",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "certifi",
    "pyyaml>=6.0",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

[project.urls]
Homepage = "https://github.com/AiM0-create/mapmise"
Issues = "https://github.com/AiM0-create/mapmise/issues"
Changelog = "https://github.com/AiM0-create/mapmise/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mapmise = "mapmise.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapmise"]

[tool.hatch.build.targets.sdist]
include = ["mapmise", "tests", "docs", "experiments", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
