[project]
name = "geofetch"
version = "0.0.1"
description = "Project-first, reproducible EO data acquisition and preparation (prototype)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pystac-client>=0.9",
    "pystac>=1.12",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geofetch"]

[project.scripts]
geofetch = "geofetch.cli:main"
