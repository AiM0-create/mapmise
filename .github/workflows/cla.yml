name: contributor agreement

# Outside pull requests must tick the Contributor Licence Agreement box (CLA.md) in the pull-request description.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  cla:
    if: github.event.pull_request.user.login != 'AiM0-create'
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement box is ticked
        env:
          BODY: ${{ github.event.pull_request.body }}   # passed as data, never executed
        run: |
          if printf '%s' "$BODY" | grep -Eiq '^\s*-\s*\[x\]\s*I have read and agree to the \[Contributor Licence Agreement\]'; then
            echo "Contributor Licence Agreement accepted."
          else
            echo "::error::Please tick the Contributor Licence Agreement box in the pull-request description (see CLA.md)."
            exit 1
          fi
